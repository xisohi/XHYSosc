name: 📽 星辉影视TV
# 代码来自https://github.com/o0HalfLife0o/TVBoxOSC

# 工作流触发条件配置
on:
  # 定时触发：每天UTC时间8:00执行（北京时间16:00）
  schedule:
    - cron: 0 8 * * *

  # 手动触发：允许通过GitHub界面手动执行工作流
  workflow_dispatch:
    inputs:
      # 是否忽略构建记录强制重新构建
      rebuild:
        description: '忽略构建记录以重新构建'
        required: false
        type: boolean
      # 是否构建后不发布新版
      donotpublish:
        description: '构建后不提交发布新版'
        required: false
        type: boolean
      # 是否启用arm64支持（注意：启用后会不支持ijk解码）
      testOption:
        description: 'arm64支持，不支持ijk解码'
        required: false
        type: boolean

# 定义构建任务
jobs:
  # 主要构建任务
  build:
    runs-on: ubuntu-latest  # 使用最新的Ubuntu系统作为运行环境
    strategy:
      fail-fast: false  # 即使某个任务失败也继续执行其他任务
      matrix:
        include:
          - userName: xisohi
            repoName: XHYSTV
            branchName: main
            java_ver: 17

    # 构建步骤
    steps:
      # 步骤1：检出当前仓库代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 步骤2：配置Java开发环境
      - name: ☕ 设置 JDK ${{ matrix.java_ver }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java_ver }}
          distribution: 'adopt'

      # 步骤3：检查源仓库是否有新提交
      - name: 🔍 检查新提交
        run: |
          # 构建源仓库的URL
          upStream="https://github.com/${{  matrix.userName }}/${{ matrix.repoName }}"
          echo "upStream=$upStream" >> $GITHUB_ENV
          
          # 通过GitHub API获取最新提交的SHA值
          commit=$(curl -sL "https://api.github.com/repos/${{  matrix.userName }}/${{ matrix.repoName }}/commits/${{ matrix.branchName }}" | jq -r '.sha')
          
          # 检查API调用是否成功
          if [ $? -ne 0 ]; then
            echo "Failed to get commit from API"
            exit 1
          fi
          
          # 检查该提交是否已经在README.md中记录过
          if [ -z "$commit" ] || ! grep -q "$commit" README.md; then
            echo "commit=$commit" >> $GITHUB_ENV
            echo "commitS=${commit:0:7}" >> $GITHUB_ENV  # 取前7位作为短哈希
          fi

      # 步骤4：检出源代码（仅在有新提交时执行）
      - name: 📥 检出 Source 源码
        if: ${{ env.commit }}
        run: |
          # 克隆源仓库到XHYSosc目录
          git clone ${{ env.upStream }} XHYSosc
          cd XHYSosc
          # 切换到指定的提交版本
          git checkout ${{ env.commit }}
          # 生成版本标签（基于提交日期，格式：年+月+日）
          echo "tag=$(git log --date=format:'%y%m%d' --pretty=format:%cd ${{ env.commitS }} -1)" >> $GITHUB_ENV

      # 步骤5：修改构建配置
      - name: ✎ Extra Modify
        if: ${{ env.commit }}
        working-directory: XHYSosc
        run: |
          echo 'crosswalk源，防挂'
          # 检查build.gradle中是否已有crosswalk配置
          if grep -q 'crosswalk' build.gradle; then
            # 如果存在则在crosswalk后面添加新的maven源
            sed -i "/crosswalk/a\        maven { url 'https://o0halflife0o.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          else
            # 如果不存在则在jitpack.io后面添加
            sed -i "/jitpack.io/a\        maven { url 'https://o0halflife0o.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          fi

      # 步骤6：压缩源代码
      - name: 📚️ Compress Source Code
        if: ${{ env.commit }}
        working-directory: XHYSosc
        run: |
          # 使用tar压缩（排除.git和.github目录）
          tar -cJf sourceCode-${{ env.commitS }}.tar.xz --exclude=.git --exclude=.github *

      # 步骤7：设置应用版本号
      - name: © Set versionCode and versionName
        if: ${{ env.commit }}
        working-directory: XHYSosc
        run: |
          # 设置版本代码（使用日期标签）
          sed -i 's/versionCode [0-9]*/versionCode ${{ env.tag }}/g' app/build.gradle
          # 设置版本名称
          sed -i "s/versionName '[^']*'/versionName '${{ env.tag }}'/g" app/build.gradle

      # 步骤8：配置Python环境
      - name: Setup Python
        if: ${{ env.commit }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      # 步骤9：安装Python依赖
      - name: Install Python dependencies
        if: ${{ env.commit }}
        run: |
          python -m pip install --upgrade pip
          # 安装项目所需的Python库
          pip install lxml ujson pyquery requests jsonpath cachetools pycryptodome beautifulsoup4

      # 步骤10：修改pyramid模块的构建配置
      - name: Modify pyramid——build.gradle
        if: ${{ env.commit }}
        working-directory: XHYSosc
        run: |
          # 删除Windows路径的Python配置（适配Linux环境）
          sed -i '/buildPython("D:\/Programs\/Python\/Python38\/python.exe")/d' pyramid/build.gradle

      # 步骤11：配置本地属性文件
      - name: Setup Python local.properties
        if: ${{ env.commit }}
        working-directory: XHYSosc
        run: echo "" > local.properties

      # 步骤12：配置APK签名
      - name: Release Apk Sign
        if: ${{ env.commit }}
        working-directory: XHYSosc
        run: |
          # Base64解码签名配置（安全考虑，将敏感信息编码存储）
          signingConfigs=''
          signingConfig='ICAgICAgICAgICAgaWYgKHByb2plY3QuaGFzUHJvcGVydHkoIlJFTEVBU0VfU1RPUkVfRklMRSIpKSB7XAogICAgICAgICAgICAgICAgc2lnbmluZ0NvbmZpZyBzaWduaW5nQ29uZmlncy5teUNvbmZpZ1wKICAgICAgICAgICAgfVwK'
          
          # 解码并添加到build.gradle
          signingConfigs="$(echo "$signingConfigs" |base64 -d )"
          signingConfig="$(echo "$signingConfig" |base64 -d )"
          sed -i -e "/defaultConfig {/i\\$signingConfigs " -e "/debug {/a\\$signingConfig " -e "/release {/a\\$signingConfig " app/build.gradle
          
          # 复制密钥库文件
          cp -f ${{ github.workspace }}/.github/workflows/TVBoxOSC.jks app/TVBoxOSC.jks
          
          # 配置签名相关的环境变量
          sed -i '$a\RELEASE_STORE_FILE=./TVBoxOSC.jks'     ./gradle.properties
          sed -i '$a\RELEASE_KEY_ALIAS=TVBoxOSC'            ./gradle.properties
          sed -i '$a\RELEASE_STORE_PASSWORD=xh8621989'       ./gradle.properties
          sed -i '$a\RELEASE_KEY_PASSWORD=xh8621989'         ./gradle.properties

      # 步骤13：配置Gradle构建工具
      - name: Setup Gradle
        if: ${{ env.commit }}
        uses: gradle/gradle-build-action@v2

      # 步骤14：编译项目（核心构建步骤）
      - name: 🏗️ 编译项目
        if: ${{ env.commit }}
        working-directory: XHYSosc
        run: |
          chmod +x gradlew  # 赋予执行权限
          # 使用Gradle编译Release版本（开启缓存和并行编译）
          ./gradlew assemblerelease --build-cache --parallel --daemon --warning-mode all

      # 步骤15：整理构建产物
      - name: Prepare App
        if: ${{ env.commit }}
        working-directory: XHYSosc
        run: |
          rm -rf apk/
          mkdir -p apk/
          find app/build/outputs/apk -path "*/release/*.apk" -exec cp -v {} apk/ \;

      # 步骤16：生成构建摘要（更新日志）
      - name: 📊 生成构建摘要
        if: ${{ env.commit }}
        working-directory: XHYSosc
        run: |
          # 从README中获取上次记录的提交
          lastCommit=$(grep "${{ matrix.userName }}\/${{ matrix.repoName }}" ${{ github.workspace }}/README.md |grep -o '[a-z0-9]\{40\}')
          export LESSCHARSET=utf-8
          echo -e "Credit: [${{ matrix.userName }}](${{ env.upStream }})\nCommit: ${{ env.commit }}\nChangelog:" > apk/${{ matrix.userName }}-Release.log
          
          # 生成格式化的更新日志
          if [ "${{ env.commit }}" == "${lastCommit}" ]; then
            # 如果是新提交，显示该提交的日志
            git log --pretty=format:%B ${{ env.commitS }} -1 |sed -e "s# \{2,\}#\n#g" -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' |cat -n |sort -k2,2 -k1,1n |uniq -f1 |sort -k1,1n |cut -f2- >> apk/${{ matrix.userName }}-Release.log
          else
            # 否则显示从上次提交到现在的所有变更
            git log --pretty=format:%B ${{ env.commitS }}...${lastCommit:0:7} |sed -e "s# \{2,\}#\n#g" -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' |cat -n |sort -k2,2 -k1,1n |uniq -f1 |sort -k1,1n |cut -f2- >> apk/${{ matrix.userName }}-Release.log
          fi

      # 步骤17：生成更新摘要（简化版）
      - name: 📊 生成更新摘要
        if: ${{ env.commit }}
        working-directory: XHYSosc
        run: |
          lastCommit=$(grep "${{ matrix.userName }}\/${{ matrix.repoName }}" ${{ github.workspace }}/README.md |grep -o '[a-z0-9]\{40\}')
          export LESSCHARSET=utf-8
          echo -e "Credit: [${{ matrix.userName }}](${{ env.upStream }})\nCommit: ${{ env.commit }}\nChangelog:" > apk/${{ matrix.repoName }}.log
          if [ "${{ env.commit }}" == "${lastCommit}" ]; then
            git log --pretty=format:%B ${{ env.commitS }} -1 |sed -e "s# \{2,\}#\n#g" -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' |cat -n |sort -k2,2 -k1,1n |uniq -f1 |sort -k1,1n |cut -f2- > apk/${{ matrix.repoName }}.log
          else
            git log --pretty=format:%B ${{ env.commitS }}...${lastCommit:0:7} |sed -e "s# \{2,\}#\n#g" -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' |cat -n |sort -k2,2 -k1,1n |uniq -f1 |sort -k1,1n |cut -f2- > apk/${{ matrix.repoName }}.log
          fi

      # 步骤18：上传构建产物到Artifacts
      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        if: ${{ env.commit }}
        with:
          name: ${{ matrix.userName }}-${{ matrix.repoName }}
          path: |
            XHYSosc/apk/*

      # 步骤19：判断是否发布（如果选择了不发布则清除commit变量）
      - name: Whether Or Not to Publish
        if: ${{ inputs.donotpublish && env.commit }}
        run: |
          echo "commit=" >> $GITHUB_ENV

      # 步骤20：构建更新内容（用于应用内更新）
      - name: Build Upgrade content
        if: ${{ env.commit }}
        working-directory: XHYSosc
        run: |
          # 提取版本代码
          echo "code=$(grep -oP 'versionCode \K\d+' app/build.gradle)" >> $GITHUB_ENV
          # 生成更新描述（按行编号）
          echo "desc=$(awk 'BEGIN{ORS="\\\\n"}{print NR ": " $0}' apk/${{ matrix.repoName }}.log)" >> $GITHUB_ENV

      # 步骤21：发布Release并上传文件
      - name: Release and Upload Assets
        uses: ncipollo/release-action@v1
        if: ${{ env.commit }}
        with:
          name: ${{ matrix.repoName }}
          tag: ${{ matrix.repoName }}
          bodyFile: XHYSosc/apk/${{ matrix.userName }}-Release.log
          allowUpdates: true
          removeArtifacts: true
          artifacts: |
            XHYSosc/apk/*.apk
            XHYSosc/sourceCode-${{ env.commitS }}.*

      # 步骤22：推送更新到仓库（更新README和JSON配置）
      - name: Push to master
        if: ${{ env.commit }}
        run: |
          rm -rf XHYSosc  # 清理源码目录
          sed -i '/url =/d' ./.git/config
          
          # 配置Git用户信息
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 添加带token的远程地址用于推送
          git remote set-url --add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          
          # 拉取最新代码（避免冲突）
          git pull --rebase
          
          # 更新README.md中的提交记录
          sed -i "/${{ matrix.userName }}\/${{ matrix.repoName }}/s#Updated: [a-zA-Z0-9]*#Updated: ${{ env.commit }}#" README.md
          
          # 更新应用更新配置文件（JSON格式）
          sed -i 's/"code": "[^"]*"/"code": "${{ env.code }}"/' update/${{ matrix.repoName }}.json
          sed -i 's/"name": "[^"]*"/"name": "${{ env.code }}"/' update/${{ matrix.repoName }}.json
          sed -i 's|"desc": ".*"|"desc": "${{ env.desc }}"|g' update/${{ matrix.repoName }}.json
          
          # 提交并推送更改
          git add --all
          git commit -m "${{ env.commit }}"
          git push -u -f origin master

  # 清理任务：删除旧的workflow运行记录
  clean:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Delete older workflow runs and artifacts
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
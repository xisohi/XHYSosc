name: coocaa Whitelist Manager

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: '忽略构建记录以重新构建'
        required: false
        type: boolean
      donotpublish:
        description: '构建后不提交发布新版'
        required: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    strategy:
      fail-fast: false
      matrix:
        include:
          - userName: xisohi
            repoName: coocaa-App-InstalLimit
            branchName: master
            java_ver: 11
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Build Info
        run: |
          upStream="https://github.com/${{ matrix.userName }}/${{ matrix.repoName }}"
          echo "upStream=$upStream" >> $GITHUB_ENV
          commit=$(curl -sL "https://api.github.com/repos/${{ matrix.userName }}/${{ matrix.repoName }}/commits/${{ matrix.branchName }}" | jq -r '.sha')
          if [ $? -ne 0 ]; then
            echo "Failed to get commit from API"
            exit 1
          fi
          echo "commit=$commit" >> $GITHUB_ENV
          echo "commitS=${commit:0:7}" >> $GITHUB_ENV

      - name: Checkout Source Code
        if: ${{ env.commit }}
        run: |
          git clone --branch ${{ matrix.branchName }} ${{ env.upStream }} XHYSosc
          cd XHYSosc
          git checkout ${{ env.commit }}
          echo "tag=$(date +'%y%m%d')" >> $GITHUB_ENV

      - name: Set up JDK ${{ matrix.java_ver }}
        if: ${{ env.commit }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java_ver }}
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: 'XHYSosc/**/build.gradle*'

      - name: Setup Android SDK
        if: ${{ env.commit }}
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > XHYSosc/local.properties
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-30" "build-tools;30.0.3" || true

      - name: Compress Source Code
        if: ${{ env.commit }}
        working-directory: XHYSosc
        run: |
          tar -cJf sourceCode-${{ env.commitS }}.tar.xz --exclude=.git --exclude=.github *

      - name: Release Apk Sign
        if: ${{ env.commit }}
        working-directory: XHYSosc
        run: |
          # 复制签名文件到项目目录
          cp -f ${{ github.workspace }}/.github/workflows/TVBoxOSC.jks app/TVBoxOSC.jks
          
          # 配置签名信息到 gradle.properties（build.gradle 会自动读取这些变量）
          echo "" >> ./gradle.properties
          echo "RELEASE_STORE_FILE=./TVBoxOSC.jks" >> ./gradle.properties
          echo "RELEASE_KEY_ALIAS=TVBoxOSC" >> ./gradle.properties
          echo "RELEASE_STORE_PASSWORD=xh8621989" >> ./gradle.properties
          echo "RELEASE_KEY_PASSWORD=xh8621989" >> ./gradle.properties

      - name: Fix Gradle Permissions
        if: ${{ env.commit }}
        working-directory: XHYSosc
        run: chmod +x gradlew

      - name: Build With Gradle
        if: ${{ env.commit }}
        working-directory: XHYSosc
        run: ./gradlew assembleRelease --build-cache --parallel --warning-mode all

      - name: Prepare App
        if: ${{ env.commit }}
        working-directory: XHYSosc
        run: |
          rm -rf apk/
          mkdir -p apk/
          cp app/build/outputs/apk/release/*.apk apk/${{ matrix.repoName }}.apk

      - name: Release Note
        if: ${{ env.commit }}
        working-directory: XHYSosc
        run: |
          export LESSCHARSET=utf-8
          echo -e "Credit: [${{ matrix.userName }}](${{ env.upStream }})\nCommit: ${{ env.commit }}\nChangelog:" > apk/${{ matrix.userName }}-Release.log
          git log --pretty=format:"- %s (%h)" -10 >> apk/${{ matrix.userName }}-Release.log

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        if: ${{ env.commit }}
        with:
          name: ${{ matrix.userName }}-${{ matrix.repoName }}
          path: |
            XHYSosc/apk/*
            XHYSosc/sourceCode-${{ env.commitS }}.tar.xz

      - name: Whether Or Not to Publish
        if: ${{ inputs.donotpublish && env.commit }}
        run: |
          echo "commit=" >> $GITHUB_ENV

      - name: Release and Upload Assets
        uses: ncipollo/release-action@v1
        if: ${{ env.commit }}
        with:
          name: ${{ matrix.repoName }}
          tag: ${{ matrix.repoName }}
          bodyFile: XHYSosc/apk/${{ matrix.userName }}-Release.log
          allowUpdates: true
          removeArtifacts: true
          artifacts: |
            XHYSosc/apk/*.apk
            XHYSosc/sourceCode-${{ env.commitS }}.*
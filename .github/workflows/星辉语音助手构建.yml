name: 星辉语音助手构建

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: '忽略构建记录以重新构建'
        required: false
        type: boolean
      donotpublish:
        description: '构建后不提交发布新版'
        required: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    strategy:
      fail-fast: false
      matrix:
        include:
          - userName: xisohi
            repoName: vosk-android-demo
            branchName: master
            java_ver: 17
    
    steps:
      - name: Checkout XHYSosc (当前仓库)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Build Info
        run: |
          upStream="https://github.com/${{ matrix.userName }}/${{ matrix.repoName }}"
          echo "upStream=$upStream" >> $GITHUB_ENV
          commit=$(curl -sL "https://api.github.com/repos/${{ matrix.userName }}/${{ matrix.repoName }}/commits/${{ matrix.branchName }}" | jq -r '.sha')
          if [ $? -ne 0 ]; then
            echo "Failed to get commit from API"
            exit 1
          fi
          echo "commit=$commit" >> $GITHUB_ENV
          echo "commitS=${commit:0:7}" >> $GITHUB_ENV

      - name: Checkout vosk-android-demo Source Code
        if: ${{ env.commit }}
        run: |
          git clone --branch ${{ matrix.branchName }} ${{ env.upStream }} XHYSosc
          cd XHYSosc
          git checkout ${{ env.commit }}
          echo "tag=$(git log --date=format:'%y%m%d' --pretty=format:%cd ${{ env.commitS }} -1)" >> $GITHUB_ENV

      - name: Set up JDK ${{ matrix.java_ver }}
        if: ${{ env.commit }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java_ver }}
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: 'XHYSosc/**/build.gradle*'

      - name: Setup Android SDK
        if: ${{ env.commit }}
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > XHYSosc/local.properties
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Compress Source Code
        if: ${{ env.commit }}
        working-directory: XHYSosc
        run: |
          tar -cJf sourceCode-${{ env.commitS }}.tar.xz --exclude=.git --exclude=.github *

      - name: Fix Gradle Permissions
        if: ${{ env.commit }}
        working-directory: XHYSosc
        run: chmod +x gradlew

      - name: Build With Gradle
        if: ${{ env.commit }}
        working-directory: XHYSosc
        run: ./gradlew assembleRelease --build-cache --parallel --warning-mode all

      - name: Sign app APK  # 使用你验证过的签名方式
        if: ${{ env.commit }}
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: XHYSosc/app/build/outputs/apk/release
          alias: ${{ secrets.ALIAS }}
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ALIAS_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Prepare App
        if: ${{ env.commit }}
        working-directory: XHYSosc
        run: |
          rm -rf apk/
          mkdir -p apk/
          # 查找签名后的 APK（通常包含 signed 关键字）
          for file in `find app/build/outputs/apk/release -name "*signed*.apk" -print`; do
            base=$(basename "$file")
            new_base="星辉语音助手-${{ env.tag }}.apk"
            mv "$file" "apk/$new_base"
            break  # 只取第一个签名后的 APK
          done
          # 如果没有找到 signed 文件，尝试找 release APK
          if [ ! -f apk/*.apk ]; then
            cp app/build/outputs/apk/release/*.apk apk/星辉语音助手-${{ env.tag }}.apk
          fi
          # 复制源代码
          cp sourceCode-${{ env.commitS }}.tar.xz apk/

      - name: Release Note
        if: ${{ env.commit }}
        working-directory: XHYSosc
        run: |
          export LESSCHARSET=utf-8
          echo -e "Credit: [${{ matrix.userName }}](${{ env.upStream }})\nCommit: ${{ env.commit }}\nChangelog:" > apk/${{ matrix.userName }}-Release.log
          cd ${{ github.workspace }}
          git log --pretty=format:"- %s (%h)" -10 >> XHYSosc/apk/${{ matrix.userName }}-Release.log

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        if: ${{ env.commit }}
        with:
          name: ${{ matrix.userName }}-${{ matrix.repoName }}
          path: |
            XHYSosc/apk/*

      - name: Whether Or Not to Publish
        if: ${{ inputs.donotpublish && env.commit }}
        run: |
          echo "commit=" >> $GITHUB_ENV

      - name: Release and Upload Assets
        uses: ncipollo/release-action@v1
        if: ${{ env.commit }}
        with:
          name: 星辉语音助手-${{ env.tag }}
          tag: ${{ env.tag }}
          bodyFile: XHYSosc/apk/${{ matrix.userName }}-Release.log
          allowUpdates: true
          removeArtifacts: true
          artifacts: |
            XHYSosc/apk/*.apk
            XHYSosc/apk/sourceCode-${{ env.commitS }}.*
